<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kyro Browser</title>
    <meta name="description" content="Search the web with Kyro.">

    <style>
        :root {
            --background: #f5faff;
            --text: #1d1d1f;
            --secondary: #6e6e73;
            --blue: #0071e3;
            --glass: rgba(255, 255, 255, 0.72);
            --border: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Helvetica,
                Arial,
                sans-serif;

            color: var(--text);
            background:
                radial-gradient(
                    circle at 50% 30%,
                    #dff4ff 0%,
                    #edf8ff 28%,
                    var(--background) 65%
                );

            -webkit-font-smoothing: antialiased;
        }


        /* NAV */

        nav {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background: rgba(245, 250, 255, .78);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom: 1px solid rgba(0, 0, 0, .06);

            z-index: 10;
        }

        .logo {
            color: var(--text);

            text-decoration: none;

            font-size: 20px;
            font-weight: 600;

            letter-spacing: -.045em;
        }

        .logo span {
            color: var(--blue);
        }

        .home {
            color: var(--secondary);

            text-decoration: none;

            font-size: 14px;

            transition: color .2s ease;
        }

        .home:hover {
            color: var(--text);
        }


        /* MAIN */

        main {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 100px 20px 60px;
        }


        /* TITLE */

        .title {
            text-align: center;

            margin-bottom: 42px;
        }

        .title h1 {
            font-size: clamp(60px, 9vw, 105px);

            font-weight: 600;

            letter-spacing: -.075em;

            line-height: .95;
        }

        .title h1 span {
            color: var(--blue);
        }

        .title p {
            margin-top: 16px;

            color: var(--secondary);

            font-size: 18px;

            letter-spacing: -.015em;
        }


        /* SEARCH */

        .search-container {
            width: min(680px, 100%);
        }

        .search {
            width: 100%;

            height: 64px;

            display: flex;
            align-items: center;

            padding: 0 9px 0 22px;

            background: var(--glass);

            border: 1px solid rgba(255, 255, 255, .9);

            border-radius: 999px;

            box-shadow:
                0 20px 60px rgba(0, 100, 170, .10),
                inset 0 1px 0 rgba(255, 255, 255, .9);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            transition:
                box-shadow .25s ease,
                border-color .25s ease;
        }

        .search:focus-within {
            border-color: rgba(0, 113, 227, .3);

            box-shadow:
                0 20px 70px rgba(0, 100, 170, .14),
                0 0 0 4px rgba(0, 113, 227, .08);
        }

        .search-icon {
            width: 22px;
            height: 22px;

            margin-right: 12px;

            color: var(--secondary);

            flex-shrink: 0;
        }

        .search input {
            flex: 1;

            width: 100%;

            border: 0;
            outline: 0;

            background: transparent;

            color: var(--text);

            font-family: inherit;

            font-size: 17px;
        }

        .search input::placeholder {
            color: #8b949b;
        }

        .search button {
            height: 46px;

            padding: 0 21px;

            border: 0;

            border-radius: 999px;

            background: var(--blue);

            color: white;

            font-family: inherit;

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease;
        }

        .search button:hover {
            background: #0077ed;

            transform: scale(1.025);
        }

        .search button:active {
            transform: scale(.98);
        }


        /* SHORTCUT */

        .shortcut {
            margin-top: 18px;

            color: #8a959d;

            font-size: 12px;

            text-align: center;
        }

        kbd {
            padding: 3px 7px;

            border: 1px solid rgba(0, 0, 0, .08);

            border-radius: 5px;

            background: rgba(255,255,255,.65);

            font-family: inherit;

            font-size: 11px;
        }


        /* FOOTER */

        footer {
            position: fixed;

            bottom: 25px;

            left: 0;

            width: 100%;

            text-align: center;

            color: #8a959d;

            font-size: 12px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            .title h1 {
                font-size: 65px;
            }

            .title p {
                font-size: 16px;
            }

            .search {
                height: 58px;

                padding-left: 18px;
            }

            .search button {
                height: 42px;

                padding: 0 17px;
            }

            .search input {
                font-size: 16px;
            }

            .shortcut {
                display: none;
            }

            footer {
                bottom: 18px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <a href="/" class="logo">
            kyro<span>.</span>
        </a>

        <a href="/" class="home">
            Back to kyro.
        </a>

    </nav>


    <main>

        <div class="title">

            <h1>
                kyro<span>.</span>
            </h1>

            <p>
                Search the web.
            </p>

        </div>


        <div class="search-container">

            <form
                class="search"
                action="https://www.google.com/search"
                method="GET"
            >

                <svg
                    class="search-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-4-4"></path>
                </svg>

                <input
                    id="search"
                    type="search"
                    name="q"
                    placeholder="Search Google"
                    autocomplete="off"
                    autofocus
                    aria-label="Search the web"
                >

                <button type="submit">
                    Search
                </button>

            </form>

            <div class="shortcut">
                Press <kbd>Enter</kbd> to search
            </div>

        </div>

    </main>


    <footer>
        kyro. · powered by Google
    </footer>


    <script>
        const search = document.getElementById("search");

        document.addEventListener("keydown", (event) => {
            if (
                event.key === "/" &&
                document.activeElement !== search
            ) {
                event.preventDefault();
                search.focus();
            }
        });
    </script>

</body>
</html>
