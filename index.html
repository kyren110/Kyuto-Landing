<!DOCTYPE html>
<html>
<head>
    <title>Kyuto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0a0a0a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: clamp(70px, 15vw, 180px);
            margin: 0;
            letter-spacing: -8px;
            font-weight: 800;
        }

        p {
            color: #888;
            font-size: 20px;
            margin-top: 15px;
        }

        .buttons {
            margin-top: 35px;
        }

        a {
            display: inline-block;
            padding: 13px 22px;
            margin: 5px;
            border-radius: 12px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        a:hover {
            transform: translateY(-3px);
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div>
            <h1>KYUTO</h1>
            <p>Technology, projects & whatever I'm building.</p>

            <div class="buttons">
                <a href="#projects">Projects</a>
                <a href="https://github.com/kyren110">GitHub</a>
            </div>
        </div>
    </section>

</body>
</html>
